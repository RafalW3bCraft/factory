# Offline local verification only; native Switch transport runs outside this sandbox.
services:
  factory-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    user: "1000:1000"
    working_dir: /workspace
    read_only: true
    network_mode: none
    init: true
    volumes:
      - type: bind
        source: ${RESULT_REPO:-.}
        target: /workspace
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=1000,gid=1000,mode=0700
      - /run:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - HOME=/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2048m
    cpus: 2.0
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
          pids: 256
    command: ["python", "-m", "factory.sandbox_smoke"]
