[project]
name = "factory"
version = "0.2.0"
description = "Dark Factory: Autonomous multi-agent engineering, cybersecurity analysis, and digital forensics band powered by Band SDK and OpenCode."
readme = "README.md"
authors = [
    { name = "RafalW3bCraft", email = "thewhitefalcon13@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "band-sdk[opencode]>=4.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
factory = "factory:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".agents", ".venv", "workspace"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
