<svg viewBox="0 0 920 310" width="100%" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>
  
  <!-- Boxes -->
  <rect x="10" y="40" width="140" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="80" y="72" fill="#8b949e" font-size="14" font-family="sans-serif" text-anchor="middle">HUMAN</text>
  <text x="80" y="92" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">Single Dispatch</text>

  <rect x="190" y="40" width="150" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="265" y="72" fill="#58a6ff" font-size="14" font-family="sans-serif" text-anchor="middle">FOREMAN</text>
  <text x="265" y="92" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">Scoping &amp; REQs</text>

  <rect x="380" y="40" width="150" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="455" y="72" fill="#58a6ff" font-size="14" font-family="sans-serif" text-anchor="middle">SMITH</text>
  <text x="455" y="92" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">Code &amp; Commit</text>

  <rect x="570" y="40" width="150" height="70" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="645" y="72" fill="#a371f7" font-size="14" font-family="sans-serif" text-anchor="middle">INSPECTOR (MiniMax)</text>
  <text x="645" y="92" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">Clean Suite Run</text>

  <rect x="760" y="40" width="150" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="835" y="72" fill="#3fb950" font-size="14" font-family="sans-serif" text-anchor="middle">STRESSER / ACCEPT</text>
  <text x="835" y="92" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">Stage Certified</text>

  <!-- Forward Arrows -->
  <line x1="150" y1="75" x2="185" y2="75" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="75" x2="375" y2="75" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="75" x2="565" y2="75" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="75" x2="755" y2="75" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="738" y="65" fill="#3fb950" font-size="12" font-family="sans-serif" text-anchor="middle">PASS</text>

  <!-- Rejection Loop Arrow -->
  <path d="M 645 110 L 645 220 L 455 220 L 455 118" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <rect x="490" y="205" width="120" height="30" rx="4" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="550" y="225" fill="#f85149" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">REJECT (Error Repro)</text>
</svg>